#@TYPE: Machine
#@NAME: Mut@nt HD51
#@DESCRIPTION: Experimental machine contract for the Broadcom BCM7251S HD51.
#
# The receiver inventory was collected from a real Mut@nt HD51 running the
# OpenPLi-derived 4.10.12 image.  This file deliberately does not provide a
# kernel, proprietary V3D library, or DVB module recipe.  Those components
# must come from a matching external BSP; silently substituting a generic
# kernel would produce an image that cannot boot.

MACHINEOVERRIDES =. "hd51:"
SOC_FAMILY = "bcm7251s"
CHIPSET = "bcm7251s"
MACHINEBUILD = "mutant51"

TARGET_ARCH = "arm"
DEFAULTTUNE = "cortexa15hf-neon-vfpv4"
require conf/machine/include/arm/armv7a/tune-cortexa15.inc
require conf/machine/include/gfutures-arm.inc
require conf/machine/include/gfutures-oem.inc

MACHINE_FEATURES += "alsa usbhost dvb ci emmc hdmi hdmicec osdposition"

# The Gatesgarth meta-hd51 provider names are the primary contract because
# they match the Neutrino HD51 layer. OpenPLi's Scarthgap BSP uses linux-hd;
# it must not be mixed into this release.
PREFERRED_PROVIDER_virtual/kernel = "linux-gfutures"
PREFERRED_VERSION_linux-gfutures = "4.10.12"
PREFERRED_PROVIDER_virtual/dvb-driver ?= "gfutures-dvb-modules-hd51"
PREFERRED_PROVIDER_virtual/egl ?= "hd-v3ddriver-hd51"
PREFERRED_PROVIDER_virtual/libgles1 ?= "hd-v3ddriver-hd51"
PREFERRED_PROVIDER_virtual/libgles2 ?= "hd-v3ddriver-hd51"

# Machine-specific image generation belongs to the external BSP.  Do not
# claim a bootable HD51 image until its multiboot/eMMC classes are present.
HD51_BSP_REQUIRED = "1"
HD51_BSP_EXPECTED_LAYER = "meta-brands/meta-gfutures"
HD51_BSP_EXPECTED_RECIPE = "linux-gfutures_4.10.12.bb"
HD51_BSP_EXPECTED_COMMIT = "9f7fcf3093635182d51cb14c6206c83b36af4d26"
