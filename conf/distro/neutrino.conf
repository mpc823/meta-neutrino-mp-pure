require conf/distro/poky.conf
require conf/distro/include/neutrino-revisions.inc

DISTRO = "neutrino"
DISTRO_NAME = "Neutrino-MP"
DISTRO_VERSION = "modern"
DISTRO_CODENAME = "wrynose"

# The layer intentionally keeps the historical seife opkg-utils fork for its
# C update-alternatives implementation. Its opkg-build supports gzip but not
# the newer OE-Core zstd/-a command line, so select the compatible command
# for every package written by this distro.
OPKGBUILDCMD = "opkg-build -Z gzip"

PACKAGE_CLASSES ?= "package_ipk"
EXTRA_IMAGE_FEATURES ?= ""
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
DISTRO_FEATURES:remove = "x11 wayland opengl pulseaudio bluetooth"
INIT_MANAGER = "sysvinit"
BB_GENERATE_MIRROR_TARBALLS = "1"
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
