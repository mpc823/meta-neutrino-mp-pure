header:
  version: 14
machine: raspberrypi2
target:
  - neutrino-image
repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: 33581c84f3a85008239acbd940501a35de48dc91
    layers: {}
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: ef022bf82d79015802309d14c28b13373ebe53f5
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
    layers:
      meta-poky:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db
    layers:
      meta-oe:
      meta-multimedia:
      meta-python:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d
  neutrino:
    # A local repository: kas resolves this to the repository containing this file.
local_conf_header:
  reproducibility: |
    CONF_VERSION = "2"
    DISTRO = "neutrino"
    DISTRO_FEATURES:append = " opengl"
    MACHINE_FEATURES:remove = "vc4graphics"
    PREFERRED_PROVIDER_virtual/egl = "userland"
    PREFERRED_PROVIDER_virtual/libgles2 = "userland"
    PACKAGE_CLASSES = "package_ipk"
    DL_DIR = "${TOPDIR}/../../.neutrino-build/downloads"
    SSTATE_DIR = "${TOPDIR}/../../.neutrino-build/sstate-cache"
    IMAGE_FSTYPES:append = " wic.bz2"
