    commit: 9f7fcf3093635182d51cb14c6206c83b36af4d26
    layers:
      meta-oe:
      meta-brands/meta-gfutures:
  neutrino:
    # A local repository: kas resolves this to the repository containing this file.
local_conf_header:
  reproducibility: |
    CONF_VERSION = "2"
    DISTRO = "neutrino"
    MACHINEBUILD = "mutant51"
    PACKAGE_CLASSES = "package_ipk"
    BB_NUMBER_THREADS = "2"
    PARALLEL_MAKE = "-j2"
    DL_DIR = "${TOPDIR}/../../.neutrino-build/downloads/hd51"
    SSTATE_DIR = "${TOPDIR}/../../.neutrino-build/sstate-cache/hd51"
    LICENSE_FLAGS_ACCEPTED:append = " commercial"
