#@TYPE: Machine
#@NAME: Mut@nt HD51
#@DESCRIPTION: Experimental machine contract for the Broadcom BCM7251S HD51.
#
# The receiver inventory was collected from a real Mut@nt HD51 running the
# OpenPLi-derived 4.10.12 image.  This file deliberately does not provide a
# kernel, proprietary V3D library, or DVB module recipe.  Those components
# must come from the matching external OpenPLi meta-gfutures BSP; silently
# substituting a generic kernel would produce an image that cannot boot.

MACHINEOVERRIDES =. "hd51:"
SOC_FAMILY = "bcm7251s"
CHIPSET = "bcm7251s"

TARGET_ARCH = "arm"
DEFAULTTUNE = "cortexa15hf-neon-vfpv4"
require conf/machine/include/arm/armv7a/tune-cortexa15.inc

MACHINE_FEATURES += "alsa usbhost dvb ci emmc hdmi hdmicec osdposition"

# These are the providers used by OpenPLi's hd51 BSP.  They intentionally
# remain unresolved until that BSP is supplied in the build's layer stack.
PREFERRED_PROVIDER_virtual/kernel = "linux-hd"
PREFERRED_VERSION_linux-hd = "4.10.12"
PREFERRED_PROVIDER_virtual/egl ?= "hd-v3ddriver-hd51"
PREFERRED_PROVIDER_virtual/libgles1 ?= "hd-v3ddriver-hd51"
PREFERRED_PROVIDER_virtual/libgles2 ?= "hd-v3ddriver-hd51"

# Machine-specific image generation belongs to the external BSP.  Do not
# claim a bootable HD51 image until its multiboot/eMMC classes are present.
HD51_BSP_REQUIRED = "1"
HD51_BSP_EXPECTED_LAYER = "meta-gfutures"
HD51_BSP_EXPECTED_COMMIT = "3256ee6f239a89e57d24153e06361643bd5d3441"
